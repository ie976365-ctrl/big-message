<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Big Message Display</title>
  <style>
    :root {
      color-scheme: light;
      --stage-a: #f9df6d;
      --stage-b: #f56f46;
      --stage-c: #1c7378;
      --stage-ink: #fff8e7;
      --message-size: 12vw;
      --status-bg: rgba(16, 19, 23, 0.18);
      --status-border: rgba(255, 255, 255, 0.34);
      --status-text: rgba(255, 255, 255, 0.9);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.28), transparent 20rem),
        linear-gradient(135deg, var(--stage-a), var(--stage-b) 54%, var(--stage-c));
      color: var(--stage-ink);
      font-family: "Arial Black", Impact, Haettenschweiler, sans-serif;
      overflow: hidden;
    }

    .stage {
      position: relative;
      display: grid;
      place-items: center;
      width: 100vw;
      min-height: 100vh;
      padding: clamp(22px, 4vw, 72px);
      overflow: hidden;
      isolation: isolate;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.11) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.09) 1px, transparent 1px);
      background-size: 42px 42px;
      mix-blend-mode: soft-light;
      pointer-events: none;
    }

    .stage::after {
      content: "";
      position: absolute;
      right: min(5vw, 36px);
      bottom: min(5vw, 36px);
      width: min(34vw, 360px);
      aspect-ratio: 1;
      border: 2px solid rgba(255, 255, 255, 0.24);
      border-radius: 50%;
      transform: rotate(-12deg);
      pointer-events: none;
    }

    .label,
    .status {
      position: absolute;
      z-index: 2;
      padding: 9px 12px;
      border: 1px solid var(--status-border);
      border-radius: 10px;
      background: var(--status-bg);
      color: var(--status-text);
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      backdrop-filter: blur(12px);
    }

    .label {
      top: 18px;
      left: 18px;
    }

    .status {
      right: 18px;
      bottom: 18px;
      text-transform: none;
      letter-spacing: 0;
      font-size: 0.78rem;
    }

    .message {
      position: relative;
      z-index: 1;
      width: min(100%, 1220px);
      margin: 0;
      text-align: center;
      text-wrap: balance;
      overflow-wrap: anywhere;
      font-size: clamp(3rem, var(--message-size), 14rem);
      line-height: 0.92;
      font-weight: 950;
      text-shadow: 0 0.08em 0.22em rgba(16, 19, 23, 0.28);
    }

    .message.serif {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 900;
    }

    .message.script {
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      font-style: italic;
      font-weight: 850;
    }

    .message.uppercase {
      text-transform: uppercase;
    }

    .message.outline {
      color: transparent;
      -webkit-text-stroke: 0.035em var(--stage-ink);
      text-shadow: 0 0.08em 0.22em rgba(16, 19, 23, 0.18);
    }

    .message.soft {
      font-weight: 700;
    }

    @media (max-width: 640px) {
      .message {
        font-size: clamp(2.8rem, var(--message-size), 7rem);
      }

      .label,
      .status {
        font-size: 0.72rem;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="label" id="messageLabel">Compliment</div>
    <h1 class="message uppercase" id="messageText">You Look Fantastic</h1>
    <div class="status" id="syncStatus">Loading remote settings...</div>
  </main>

  <script>
    const SETTINGS_URL = "settings.json";
    const REFRESH_MS = 5000;
    const defaultSettings = {
      message: "You Look Fantastic",
      label: "Compliment",
      theme: "sunset",
      font: "sans",
      size: "12vw",
      uppercase: true,
      outline: false,
      soft: false
    };

    const themes = {
      sunset: ["#f9df6d", "#f56f46", "#1c7378", "#fff8e7"],
      midnight: ["#15131c", "#315b91", "#f4c15d", "#fff6dc"],
      mint: ["#cbf2db", "#27887f", "#17353a", "#f7fff9"],
      rose: ["#ffe1e9", "#cf4265", "#35233a", "#fff4f7"]
    };

    const messageText = document.querySelector("#messageText");
    const messageLabel = document.querySelector("#messageLabel");
    const syncStatus = document.querySelector("#syncStatus");
    let lastSignature = "";

    function setTheme(themeName) {
      const [a, b, c, ink] = themes[themeName] || themes.sunset;
      document.documentElement.style.setProperty("--stage-a", a);
      document.documentElement.style.setProperty("--stage-b", b);
      document.documentElement.style.setProperty("--stage-c", c);
      document.documentElement.style.setProperty("--stage-ink", ink);
    }

    function applySettings(settings) {
      const next = { ...defaultSettings, ...settings };
      const signature = JSON.stringify(next);
      if (signature === lastSignature) {
        return false;
      }

      lastSignature = signature;
      messageText.textContent = next.message || defaultSettings.message;
      messageLabel.textContent = next.label || defaultSettings.label;
      document.documentElement.style.setProperty("--message-size", next.size || defaultSettings.size);

      messageText.classList.remove("serif", "script", "uppercase", "outline", "soft");
      if (next.font === "serif" || next.font === "script") {
        messageText.classList.add(next.font);
      }
      if (next.uppercase) {
        messageText.classList.add("uppercase");
      }
      if (next.outline) {
        messageText.classList.add("outline");
      }
      if (next.soft) {
        messageText.classList.add("soft");
      }

      setTheme(next.theme);
      return true;
    }

    function formatTime(date) {
      return new Intl.DateTimeFormat(undefined, {
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit"
      }).format(date);
    }

    async function loadSettings() {
      try {
        const response = await fetch(`${SETTINGS_URL}?t=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const settings = await response.json();
        const changed = applySettings(settings);
        syncStatus.textContent = changed
          ? `Updated ${formatTime(new Date())}`
          : `Checked ${formatTime(new Date())}`;
      } catch (error) {
        applySettings(defaultSettings);
        syncStatus.textContent = "Using saved display settings";
        console.error("Could not load remote settings.", error);
      }
    }

    loadSettings();
    window.setInterval(loadSettings, REFRESH_MS);
  </script>
</body>
</html>
